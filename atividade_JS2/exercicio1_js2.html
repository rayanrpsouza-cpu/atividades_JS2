<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var numero = parseInt(prompt("escreva um numero: "));
        if (numero % 2 == 0)
        {
            alert("o numero que você escreveu é " + numero + " que é um par!");
        }else{
            alert("o numero que você escreveu é " + numero + " que é um impar!");
        }
    </script>
</body>
</html>
