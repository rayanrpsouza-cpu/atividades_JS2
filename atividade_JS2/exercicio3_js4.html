<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = parseInt(prompt("escreva um numero: "));

        if(n1 > 0)
        {
            alert("o numero informado é positivo!");
        }else if(n1 == 0)
        {
            alert("o numero informado é igual a 0!");
        }else if(n1 < 0)
        {
            alert("o numero informado é negativo!");
        }
    </script> 
</body>
</html>
