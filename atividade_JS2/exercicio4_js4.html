<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var n1 = parseInt(prompt("escreva um numero: "));
        var arm = 0;

        if(n1 > 0)
        {
            for(var i = 1; i <= n1; i++)
            {
                arm +=  i;
            }

            alert("a junção de todos os numeros é: " + arm);
        }else{
            alert("este numero não é positivo, informe outro!");
        }
    </script>
</body>
</html>
